<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Invitación · María Jimena · XV Años</title>

  <!-- Open Graph / WhatsApp preview -->
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="María Jimena XV Años · Invitación">
  <meta property="og:description" content="¡Estás invitado a celebrar mis XV Años! Abre para ver la invitación.">
  <meta property="og:url"          content="https://rsvpevents.github.io/invitacion/sobre.html">
  <meta property="og:image"       content="https://rsvpevents.github.io/invitacion/og-image.png">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card"       content="summary_large_image">
  <meta name="twitter:title"      content="María Jimena XV Años · Invitación">
  <meta name="twitter:image"      content="https://rsvpevents.github.io/invitacion/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --dark:    #070712;
      --navy:    #0d0a20;
      --gold:    #c9a84c;
      --gold-lt: #e8d080;
      --silver:  #c8ccd8;
      --silver-d:#6a6e80;
      --rose:    #8b1a30;
      --rose-br: #c41e42;
      --white:   #ffffff;
      --fd: 'Great Vibes', cursive;
      --fs: 'Cinzel', serif;
      --fb: 'Cormorant Garamond', serif;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { height:100%; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 70% 60% at 20% 70%, rgba(139,26,48,.3) 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 80% 25%, rgba(201,168,76,.1) 0%, transparent 50%),
        linear-gradient(170deg, #060611 0%, #100820 50%, #080616 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--fb);
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
    }

    /* Grid overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,.012) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,.012) 40px);
      pointer-events: none;
    }

    /* ── PETALS ── */
    #petals { position:fixed; inset:0; pointer-events:none; z-index:5; overflow:hidden; }
    .petal {
      position:absolute; top:-30px;
      background: radial-gradient(ellipse at 40% 40%, #d43060, #7b1228);
      border-radius: 50% 50% 50% 0 / 60% 60% 40% 40%;
      opacity: 0;
      animation: petalFall linear infinite;
    }
    @keyframes petalFall {
      0%   { opacity:0; transform:translateX(0) rotate(0deg); top:-30px; }
      10%  { opacity:.6; }
      90%  { opacity:.3; }
      100% { opacity:0; transform:translateX(70px) rotate(380deg); top:105vh; }
    }

    /* ── SPARKLES ── */
    .sparkle {
      position: fixed; border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, rgba(201,168,76,.6) 60%, transparent 100%);
      pointer-events: none; z-index: 4;
      animation: twinkle ease-in-out infinite;
    }
    @keyframes twinkle { 0%,100%{opacity:0;transform:scale(0)} 50%{opacity:1;transform:scale(1)} }

    /* ── MAIN SCENE ── */
    .scene {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; gap: 2rem;
      padding: 2rem 1.5rem;
      animation: sceneIn .9s ease both;
    }
    @keyframes sceneIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

    /* ── HEADER TEXT ── */
    .invite-header { text-align: center; }
    .invite-badge {
      font-family: var(--fs);
      font-size: .68rem; letter-spacing: .55em;
      color: var(--gold); text-transform: uppercase;
      opacity: .75; margin-bottom: .6rem;
    }
    .invite-title {
      font-family: var(--fd);
      font-size: clamp(2.8rem, 8vw, 5rem);
      color: var(--white);
      text-shadow: 0 0 40px rgba(201,168,76,.35), 0 0 80px rgba(201,168,76,.15);
      line-height: 1.1;
    }
    .invite-sub {
      font-family: var(--fs);
      font-size: clamp(.7rem, 1.8vw, .85rem);
      color: var(--silver-d); letter-spacing: .2em;
      margin-top: .4rem;
    }
    .invite-footer-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: .4rem .6rem;
      margin-top: .65rem;
    }
    .invite-host,
    .invite-rsvp {
      font-family: var(--fb);
      font-size: clamp(.72rem, 1.9vw, .92rem);
      font-style: italic;
      letter-spacing: .06em;
    }
    .invite-host {
      color: var(--gold);
      opacity: .9;
    }
    .invite-rsvp {
      color: var(--silver-d);
    }
    .invite-rsvp strong {
      color: var(--gold);
      font-style: normal;
      font-weight: 600;
    }
    .invite-divider {
      color: var(--gold);
      opacity: .5;
      font-size: .8rem;
    }

    /* ══════════════════════════════════
       ENVELOPE
    ══════════════════════════════════ */
    .env-wrapper {
      cursor: pointer;
      perspective: 1200px;
      perspective-origin: center 35%;
      /* hover lift */
      transition: transform .35s ease, filter .35s ease;
      filter: drop-shadow(0 20px 60px rgba(0,0,0,.7));
      user-select: none;
    }
    .env-wrapper:hover { transform: translateY(-6px); filter: drop-shadow(0 28px 70px rgba(0,0,0,.8)) drop-shadow(0 0 30px rgba(201,168,76,.15)); }
    .env-wrapper:hover .env-seal { box-shadow: 0 0 35px rgba(196,30,66,.7), 0 0 70px rgba(196,30,66,.3); }

    .envelope {
      position: relative;
      width: clamp(300px, 80vw, 450px);
      height: clamp(200px, 55vw, 300px);
      transform-style: preserve-3d;
    }

    /* Back face of envelope (always visible) */
    .env-back {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, #1a1040, #0e0828);
      border: 1px solid rgba(201,168,76,.35);
      border-radius: 3px;
      overflow: hidden;
    }
    /* Corner ornament on back */
    .env-back::before {
      content: '';
      position: absolute; inset: 6px;
      border: 1px solid rgba(201,168,76,.12);
      border-radius: 2px;
    }

    /* Interior revealed when flap opens */
    .env-interior {
      position: absolute; inset: 1px;
      border-radius: 3px;
      overflow: hidden;
      z-index: 1;
    }
    /* Top triangle (inside top) */
    .env-int-top {
      position: absolute; top: 0; left: 0; right: 0; height: 55%;
      background: linear-gradient(175deg, #241455, #160d38);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }
    /* Bottom triangle */
    .env-int-bottom {
      position: absolute; bottom: 0; left: 0; right: 0; height: 55%;
      background: linear-gradient(5deg, #130a30, #1c1048);
      clip-path: polygon(0 100%, 100% 100%, 50% 0);
    }
    /* Left triangle */
    .env-int-left {
      position: absolute; left: 0; top: 0; bottom: 0; width: 55%;
      background: linear-gradient(90deg, #160e35, #1a1040);
      clip-path: polygon(0 0, 0 100%, 100% 50%);
    }
    /* Right triangle */
    .env-int-right {
      position: absolute; right: 0; top: 0; bottom: 0; width: 55%;
      background: linear-gradient(270deg, #160e35, #1a1040);
      clip-path: polygon(100% 0, 100% 100%, 0 50%);
    }

    /* ── LETTER (slides up from inside) ── */
    .env-letter {
      position: absolute;
      bottom: 8px; left: 12%; right: 12%;
      height: 88%;
      background: linear-gradient(165deg, #faf0e0, #f0e2cc);
      border-radius: 2px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: .4rem;
      z-index: 2;
      transform: translateY(8px);
      transition: transform 1s cubic-bezier(.22,1,.36,1);
      box-shadow: 0 0 0 1px rgba(201,168,76,.3), 0 8px 30px rgba(0,0,0,.5);
    }
    .letter-rose {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      animation: roseFloat 3s ease-in-out infinite;
    }
    @keyframes roseFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    .letter-name {
      font-family: var(--fd);
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      color: #3a1a08; line-height: 1;
    }
    .letter-xv {
      font-family: var(--fs);
      font-size: clamp(.52rem, 1.3vw, .68rem);
      letter-spacing: .4em; color: #8a5820;
      text-transform: uppercase;
    }

    /* ── SIDE FLAPS (exterior, on top of interior) ── */
    .env-side {
      position: absolute; top: 0; bottom: 0; z-index: 3;
    }
    .env-side-left {
      left: 0; width: 50%;
      background: linear-gradient(95deg, #18103a, #12092e);
      clip-path: polygon(0 0, 0 100%, 100% 50%);
      border-left: 1px solid rgba(201,168,76,.35);
    }
    .env-side-right {
      right: 0; width: 50%;
      background: linear-gradient(265deg, #18103a, #12092e);
      clip-path: polygon(100% 0, 100% 100%, 0 50%);
      border-right: 1px solid rgba(201,168,76,.35);
    }

    /* ── BOTTOM FLAP (exterior) ── */
    .env-bottom {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 55%; z-index: 4;
      background: linear-gradient(175deg, #14102e, #0e0a22);
      clip-path: polygon(0 100%, 100% 100%, 50% 0);
      border-bottom: 1px solid rgba(201,168,76,.35);
      border-left: 1px solid rgba(201,168,76,.18);
      border-right: 1px solid rgba(201,168,76,.18);
    }

    /* ── TOP FLAP (the one that opens) ── */
    .env-flap-wrap {
      position: absolute; top: 0; left: 0; right: 0;
      height: 100%; z-index: 8;
      transform-origin: top center;
      transform-style: preserve-3d;
      transition: transform 1.1s cubic-bezier(.4,0,.2,1);
    }
    .env-flap-wrap.open {
      transform: rotateX(-178deg);
    }
    .env-flap-front {
      position: absolute; top: 0; left: 0; right: 0; height: 56%;
      background: linear-gradient(175deg, #201250, #160e38);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      border-top: 1px solid rgba(201,168,76,.35);
      border-left: 1px solid rgba(201,168,76,.2);
      border-right: 1px solid rgba(201,168,76,.2);
      /* gold foil edge shimmer */
    }
    .env-flap-front::after {
      content: '';
      position: absolute; top:0; left:0; right:0; height:100%;
      background: linear-gradient(135deg, rgba(201,168,76,.08) 0%, transparent 40%, rgba(201,168,76,.05) 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }
    /* Back of flap (visible when fully open) */
    .env-flap-back {
      position: absolute; top: 0; left: 0; right: 0; height: 56%;
      background: linear-gradient(175deg, #241458, #18103a);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      backface-visibility: visible;
      transform: rotateX(180deg) translateZ(.5px);
    }

    /* ── WAX SEAL ── */
    .env-seal {
      position: absolute;
      top: 43%; left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(44px, 12vw, 58px);
      height: clamp(44px, 12vw, 58px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e03060, #c41e42 45%, #8b1a30);
      border: 1.5px solid rgba(201,168,76,.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
      box-shadow: 0 0 24px rgba(196,30,66,.5), 0 0 50px rgba(196,30,66,.25), inset 0 1px 0 rgba(255,255,255,.2);
      transition: transform .35s ease, opacity .4s ease, box-shadow .35s;
      cursor: pointer;
    }
    .env-seal span {
      font-family: var(--fd);
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      color: rgba(255,230,150,.9);
      text-shadow: 0 1px 3px rgba(0,0,0,.4);
    }
    /* Wax texture ridges */
    .env-seal::before {
      content: '';
      position: absolute; inset: 4px;
      border-radius: 50%;
      border: 1px solid rgba(255,100,100,.25);
    }
    .env-seal::after {
      content: '';
      position: absolute; inset: 8px;
      border-radius: 50%;
      border: 1px solid rgba(255,100,100,.15);
    }
    /* Seal glow pulse (idle) */
    .env-seal.pulse {
      animation: sealPulse 2.5s ease-in-out infinite;
    }
    @keyframes sealPulse {
      0%,100% { box-shadow: 0 0 24px rgba(196,30,66,.5), 0 0 50px rgba(196,30,66,.25); }
      50%      { box-shadow: 0 0 36px rgba(196,30,66,.75), 0 0 70px rgba(196,30,66,.4); }
    }
    /* Seal breaking */
    .env-seal.breaking {
      animation: sealBreak .4s ease forwards;
    }
    @keyframes sealBreak {
      0%  { transform: translate(-50%,-50%) scale(1); }
      40% { transform: translate(-50%,-50%) scale(1.2) rotate(5deg); }
      100%{ transform: translate(-50%,-50%) scale(0) rotate(15deg); opacity: 0; }
    }

    /* ── HINT TEXT ── */
    .hint {
      font-family: var(--fs);
      font-size: clamp(.6rem, 1.8vw, .78rem);
      letter-spacing: .35em;
      color: var(--silver-d); text-transform: uppercase;
      animation: hintPulse 2s ease-in-out infinite;
      transition: opacity .5s ease;
    }
    .hint.hidden { opacity: 0; pointer-events: none; }
    @keyframes hintPulse { 0%,100%{opacity:.5} 50%{opacity:.85} }

    /* ── GOLDEN LINE ── */
    .gold-line {
      width: clamp(120px, 35vw, 200px); height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: .4;
    }

    /* ── REDIRECT OVERLAY ── */
    #overlay {
      position: fixed; inset: 0; z-index: 100;
      background: #070712;
      opacity: 0; pointer-events: none;
      transition: opacity 1s ease;
    }
    #overlay.fade { opacity: 1; pointer-events: all; }

    /* ── OPEN: letter slides up ── */
    .envelope.opened .env-letter {
      transform: translateY(clamp(-110px, -38vw, -148px));
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .scene { gap: 1.2rem; padding: 1.5rem 1rem; }
      .invite-title { font-size: clamp(2rem, 11vw, 3.2rem); }
      .invite-badge { letter-spacing: .3em; font-size: .62rem; }
      .hint { letter-spacing: .2em; }
    }
    @media (max-width: 360px) {
      .scene { gap: .9rem; padding: 1.2rem .8rem; }
      .invite-title { font-size: clamp(1.8rem, 11vw, 2.6rem); }
      .rsvp-notice { font-size: .72rem; padding: .4rem .8rem; }
    }
  </style>
</head>
<body>

<div id="petals"></div>
<div id="overlay"></div>

<div class="scene">

  <!-- Header -->
  <div class="invite-header">
    <div class="invite-badge">✦ &nbsp; Tienes una invitación especial &nbsp; ✦</div>
    <h1 class="invite-title">María Jimena</h1>
    <p class="invite-sub">Cifuentes Valdez &nbsp;·&nbsp; XV Años</p>
    <div class="invite-footer-row">
      <span class="invite-host">Te invitan Maria Jimena y Familia</span>
      <span class="invite-divider">·</span>
      <span class="invite-rsvp">Confirma tu asistencia antes del <strong>30 de junio</strong></span>
    </div>
  </div>

  <div class="gold-line"></div>

  <!-- ══ ENVELOPE ══ -->
  <div class="env-wrapper" id="envWrapper" onclick="openEnvelope()">
    <div class="envelope" id="envelope">

      <!-- Back plate -->
      <div class="env-back"></div>

      <!-- Interior (revealed when flap opens) -->
      <div class="env-interior">
        <div class="env-int-top"></div>
        <div class="env-int-bottom"></div>
        <div class="env-int-left"></div>
        <div class="env-int-right"></div>
      </div>

      <!-- Letter inside -->
      <div class="env-letter">
        <div class="letter-rose">🌹</div>
        <div class="letter-name">María Jimena</div>
        <div class="letter-xv">✧ &nbsp; Quince Años &nbsp; ✧</div>
      </div>

      <!-- Exterior side & bottom folds -->
      <div class="env-side env-side-left"></div>
      <div class="env-side env-side-right"></div>
      <div class="env-bottom"></div>

      <!-- Top flap (opens on click) -->
      <div class="env-flap-wrap" id="flapWrap">
        <div class="env-flap-front"></div>
        <div class="env-flap-back"></div>
      </div>

      <!-- Wax seal -->
      <div class="env-seal pulse" id="seal">
        <span>M</span>
      </div>

    </div>
  </div>

  <div class="gold-line"></div>

  <!-- Hint -->
  <div class="hint" id="hint">✦ &nbsp; Toca el sobre para abrir tu invitación &nbsp; ✦</div>


</div>

<script>
  let opened = false;

  /* ── PETALS ── */
  (function(){
    const c = document.getElementById('petals');
    function mk(){
      const p = document.createElement('div');
      p.className = 'petal';
      const w = 7 + Math.random()*10;
      p.style.cssText = [
        `left:${Math.random()*100}%`,
        `width:${w}px`, `height:${w*1.4}px`,
        `animation-duration:${6+Math.random()*9}s`,
        `animation-delay:${Math.random()*12}s`,
        `opacity:${.3+Math.random()*.35}`,
        `transform:rotate(${Math.random()*360}deg)`
      ].join(';');
      c.appendChild(p);
      setTimeout(()=>p.remove(), 22000);
    }
    for(let i=0;i<18;i++) mk();
    setInterval(mk, 900);
  })();

  /* ── SPARKLES ── */
  (function(){
    for(let i=0;i<16;i++){
      const s = document.createElement('div');
      s.className = 'sparkle';
      const sz = 2 + Math.random()*3;
      s.style.cssText = [
        `left:${Math.random()*100}%`, `top:${Math.random()*100}%`,
        `width:${sz}px`, `height:${sz}px`,
        `animation-duration:${2+Math.random()*4}s`,
        `animation-delay:${Math.random()*5}s`
      ].join(';');
      document.body.appendChild(s);
    }
  })();

  /* ── OPEN ENVELOPE ── */
  function openEnvelope(){
    if(opened) return;
    opened = true;

    const seal     = document.getElementById('seal');
    const flapWrap = document.getElementById('flapWrap');
    const envelope = document.getElementById('envelope');
    const hint     = document.getElementById('hint');
    const overlay  = document.getElementById('overlay');
    const wrapper  = document.getElementById('envWrapper');

    // Disable hover effect while animating
    wrapper.style.pointerEvents = 'none';

    // 1. Hide hint
    hint.classList.add('hidden');

    // 2. Break the seal (0 → 0.4s)
    seal.classList.remove('pulse');
    seal.classList.add('breaking');

    // 3. Open the flap (0.35s → 1.45s)
    setTimeout(()=>{
      flapWrap.classList.add('open');
    }, 350);

    // 4. Letter slides up (0.9s → 1.8s)
    setTimeout(()=>{
      envelope.classList.add('opened');
    }, 900);

    // 5. Wrapper lifts and glows (1.5s)
    setTimeout(()=>{
      wrapper.style.transform = 'translateY(-12px) scale(1.02)';
      wrapper.style.filter    = 'drop-shadow(0 35px 80px rgba(0,0,0,.8)) drop-shadow(0 0 50px rgba(201,168,76,.25))';
    }, 1500);

    // 6. Fade to black → redirect (2.4s)
    setTimeout(()=>{
      overlay.classList.add('fade');
    }, 2400);

    setTimeout(()=>{
      window.location.href = 'invitacion-xv-final.html' + window.location.search;
    }, 3500);
  }

  /* ── Keyboard support ── */
  document.addEventListener('keydown', e=>{
    if(e.key==='Enter'||e.key===' ') openEnvelope();
  });
</script>
</body>
</html>
